[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "recce"
version = "0.5.0"
description = "Personal OSINT toolkit for tracing usernames, emails, phone numbers, and domains across the public internet."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "AGPL-3.0-or-later" }
authors = [{ name = "foldedarrow" }]
keywords = ["osint", "recon", "username", "email", "phone", "domain", "footprint"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
]
dependencies = [
    "httpx[http2,socks]>=0.27.0",
    "rich>=13.7.0",
    "typer>=0.12.0",
    "phonenumbers>=8.13.0",
    "dnspython>=2.6.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.6.0",
    "tldextract>=5.1.0",
    "holehe>=1.61",
    # Browser-fingerprint HTTP for username probes (gets past bot walls).
    "curl_cffi>=0.7",
    # Avatar perceptual hashing for attribution clusters.
    "pillow>=10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
]
gui = [
    "streamlit>=1.36",
    "pandas>=2.0",
]

[project.scripts]
recce = "recce.cli:app"
recce-gui = "recce.gui.launcher:main"

[project.urls]
Homepage = "https://github.com/foldedarrow/recce"
Issues = "https://github.com/foldedarrow/recce/issues"

[tool.hatch.build.targets.wheel]
packages = ["recce"]

[tool.hatch.build.targets.sdist]
include = ["recce/**/*", "docs/**/*", "README.md", "CHANGELOG.md", "CONTRIBUTING.md", "LICENSE"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "RUF"]
ignore = [
    "B008",   # Typer intentionally uses Option/Argument calls in defaults.
    "E501",
    "RUF001", # recce's CLI/GUI copy intentionally uses a few typographic glyphs.
]
